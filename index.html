<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1b5e20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>🌰 كاشف أمراض البندق</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌰%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #e8f5e9 0%, #f1f8e9 100%);
            min-height: 100vh;
            color: #212529;
            overflow-x: hidden;
            padding-bottom: 80px;
        }
        .app-container { max-width: 480px; margin: 0 auto; padding: 0; }

        /* Header */
        .header {
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: white;
            padding: 24px 20px 20px;
            text-align: center;
            border-radius: 0 0 28px 28px;
            box-shadow: 0 4px 20px rgba(46,125,50,0.35);
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .header-icon { font-size: 48px; margin-bottom: 8px; display: block; }
        .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.3px; }
        .header p { font-size: 13px; opacity: 0.85; font-weight: 400; }

        /* Status Bar */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            margin: 12px 16px 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            font-size: 13px;
            color: #666;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
        .status-dot.ready { background: #28a745; animation: pulse 2s infinite; }
        .status-dot.analyzing { background: #ffc107; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* Camera Area */
        .camera-section {
            margin: 16px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .camera-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        #previewImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .camera-placeholder {
            text-align: center;
            color: rgba(255,255,255,0.6);
            padding: 40px 20px;
        }
        .camera-placeholder .icon { font-size: 56px; margin-bottom: 12px; display: block; }
        .camera-placeholder p { font-size: 15px; }
        .camera-placeholder small { font-size: 12px; opacity: 0.7; }

        /* Scan overlay */
        .scan-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.6);
        }
        .scan-overlay.active { display: flex; }
        .scan-frame {
            width: 200px;
            height: 200px;
            border: 3px solid #4caf50;
            border-radius: 20px;
            position: relative;
        }
        .scan-line {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: #4caf50;
            box-shadow: 0 0 10px #4caf50;
            animation: scanMove 2s ease-in-out infinite;
        }
        @keyframes scanMove { 0%,100%{top:0} 50%{top:197px} }
        .scan-text {
            position: absolute;
            bottom: -40px;
            left: 0; right: 0;
            text-align: center;
            color: white;
            font-size: 14px;
            font-weight: 500;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
            padding: 14px;
            background: white;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: white;
            box-shadow: 0 3px 12px rgba(46,125,50,0.3);
        }
        .btn-danger {
            background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
            color: white;
            box-shadow: 0 3px 12px rgba(211,47,47,0.3);
        }
        .btn-secondary {
            background: #f1f3f4;
            color: #5f6368;
        }
        .btn:disabled { opacity: 0.5; transform: none !important; cursor: not-allowed; }

        /* Upload area */
        .upload-area {
            margin: 0 16px 16px;
            padding: 28px 20px;
            border: 2px dashed #c8e6c9;
            border-radius: 16px;
            text-align: center;
            background: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #2e7d32;
            background: rgba(46,125,50,0.05);
        }
        .upload-area .icon { font-size: 36px; margin-bottom: 8px; }
        .upload-area p { font-size: 14px; color: #666; }
        #fileInput { display: none; }

        /* Results */
        .result-card {
            margin: 0 16px 16px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: none;
            animation: slideUp 0.4s ease;
        }
        .result-card.show { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .result-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
        .result-emoji {
            width: 56px; height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }
        .result-emoji.healthy { background: #d4edda; }
        .result-emoji.disease { background: #f8d7da; }
        .result-info { flex: 1; }
        .result-title { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
        .result-title.healthy { color: #155724; }
        .result-title.disease { color: #721c24; }
        .result-sub { font-size: 13px; color: #888; }

        .confidence-wrap { margin-bottom: 16px; }
        .confidence-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: #666; }
        .confidence-track { height: 10px; background: #e9ecef; border-radius: 5px; overflow: hidden; }
        .confidence-fill { height: 100%; border-radius: 5px; transition: width 1s cubic-bezier(0.4,0,0.2,1); }
        .confidence-fill.healthy { background: linear-gradient(90deg, #28a745, #20c997); }
        .confidence-fill.disease { background: linear-gradient(90deg, #dc3545, #fd7e14); }

        .detail-box {
            background: #f8f9fa;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .detail-box h4 { font-size: 14px; font-weight: 700; color: #495057; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .detail-box p { font-size: 13.5px; color: #666; line-height: 1.7; }

        .all-predictions { margin-top: 12px; }
        .all-predictions h4 { font-size: 14px; font-weight: 700; color: #495057; margin-bottom: 10px; }
        .pred-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
        .pred-name { flex: 1; font-size: 13px; color: #666; }
        .pred-bar-wrap { flex: 2; height: 6px; background: #e9ecef; border-radius: 3px; overflow: hidden; }
        .pred-bar { height: 100%; border-radius: 3px; transition: width 0.8s; background: #adb5bd; }
        .pred-pct { width: 40px; text-align: left; font-size: 12px; color: #888; font-weight: 600; }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid #e9ecef;
            padding: 10px 16px;
            text-align: center;
            font-size: 12px;
            color: #888;
            z-index: 100;
        }

        /* Hidden */
        #canvas { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <span class="header-icon">🌰</span>
        <h1>كاشف أمراض البندق</h1>
        <p>ذكاء اصطناعي للكشف المبكر عن أمراض شجرة البندق</p>
    </div>

    <div class="status-bar">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">جاري التحميل...</span>
    </div>

    <div class="camera-section">
        <div class="camera-container" id="cameraContainer">
            <video id="video" autoplay playsinline></video>
            <img id="previewImg" alt="معاينة">
            <div class="camera-placeholder" id="cameraPlaceholder">
                <span class="icon">📷</span>
                <p>اضغط "تشغيل الكاميرا"</p>
                <small>للتقاط صورة لورقة البندق</small>
            </div>
            <div class="scan-overlay" id="scanOverlay">
                <div class="scan-frame">
                    <div class="scan-line"></div>
                    <div class="scan-text">🔬 جاري التحليل...</div>
                </div>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="camBtn" onclick="toggleCamera()">📷 تشغيل الكاميرا</button>
            <button class="btn btn-danger" id="captureBtn" onclick="capture()" disabled>📸 التقاط</button>
        </div>
    </div>

    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
        <div class="icon">🖼️</div>
        <p>اضغط لاختيار صورة من المعرض</p>
        <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">
    </div>

    <div class="result-card" id="resultCard">
        <div class="result-header">
            <div class="result-emoji" id="resultEmoji">🤔</div>
            <div class="result-info">
                <div class="result-title" id="resultTitle">جاري التحليل...</div>
                <div class="result-sub" id="resultSub"></div>
            </div>
        </div>

        <div class="confidence-wrap">
            <div class="confidence-label">
                <span>نسبة الثقة</span>
                <span id="confPercent">0%</span>
            </div>
            <div class="confidence-track">
                <div class="confidence-fill" id="confBar" style="width:0%"></div>
            </div>
        </div>

        <div class="detail-box">
            <h4>📋 التشخيص</h4>
            <p id="diagText"></p>
        </div>

        <div class="detail-box">
            <h4>💊 العلاج والإدارة</h4>
            <p id="treatText"></p>
        </div>

        <div class="all-predictions" id="allPreds"></div>
    </div>
</div>

<div class="footer">🌰 كاشف أمراض البندق — Powered by AI</div>

<canvas id="canvas" width="224" height="224"></canvas>

<script>
// =================== قاعدة بيانات الأمراض ===================
const DISEASE_DB = {
    'healthy': {
        emoji: '✅',
        title: 'نبات سليم',
        cssClass: 'healthy',
        desc: 'النبات في حالة صحية ممتازة. لا توجد علامات مرضية ظاهرة على الأوراق أو الأغصان. النمو طبيعي واللون أخضر داكن.',
        treatment: 'استمر في العناية المعتادة: ري منتظم (تجنب الإفراط)، تسميد متوازن (N-P-K) مرتين سنوياً، تقليم سنوي لإزالة الأغصان الميتة، ورش وقائي بالمبيدات الفطرية في فترات الرطوبة العالية.'
    },
    'diseased': {
        emoji: '⚠️',
        title: 'يوجد مرض',
        cssClass: 'disease',
        desc: 'تم اكتشاف علامات مرضية على النبات. قد تشمل بقع ملونة، تعفن، أو تشوهات على الأوراق. يُنصح بالفحص الدقيق واتخاذ إجراء سريع.',
        treatment: '1) عزل النبات المصاب عن الأصحاء. 2) إزالة الأجزاء المصابة بمقص معقم. 3) رش مبيد فطري مناسب حسب نوع المرض. 4) تحسين التهوية حول الشجرة. 5) استشر أخصائي زراعي للتشخيص الدقيق.'
    },
    'powdery': {
        emoji: '🍄',
        title: 'البياض الدقيقي',
        cssClass: 'disease',
        desc: 'فطر يسبب طبقة بيضاء أو رمادية على سطح الأوراق. ينتشر بسرعة في الظل والرطوبة العالية ودرجات الحرارة المعتدلة.',
        treatment: '1) رش كبريتات أو زيت بترولي (dormant oil). 2) تحسين التهوية بين الأشجار بالتقليم. 3) إزالة الأوراق المصابة وحرقها. 4) رش مبيدات فطرية (FRAC 3, 11) في الربيع. 5) تجنب الري العلوي المباشر.'
    },
    'rust': {
        emoji: '🍂',
        title: 'الصدأ',
        cssClass: 'disease',
        desc: 'بقع برتقالية-بنية أو صفراء على الأوراق السفلية. ينتشر في الربيع والخريف عبر الأبواغ التي تنتقل بالرياح.',
        treatment: '1) رش مبيدات نحاسية في الربيع المبكر قبل الإنبات. 2) إزالة الأوراق السفلية المصابة. 3) تجنب الري العلوي (الرذاذ ينشر الفطر). 4) تقليم الأغصان المتدلية لتحسين التهوية. 5) تطبيق مبيدات وقائية في الخريف.'
    },
    'blight': {
        emoji: '🟤',
        title: 'اللفحة البكتيرية',
        cssClass: 'disease',
        desc: 'بقع صغيرة بنية محاطة بحلقة صفراء على الأوراق. قد يخرج سائل لزج من الجروح في الرطوبة العالية. ينتشر عبر أدوات التقليم غير المعقمة.',
        treatment: '1) تجنب الري العلوي (الرذاذ ينشر البكتيريا). 2) تعقيم أدوات التقليم بمحلول الكلور 10% بين كل شجرة. 3) إزالة الأشجار المصابة بشدة. 4) رش مبيدات نحاسية في الربيع. 5) زراعة شتلات معتمدة خالية من المرض.'
    },
    'mite': {
        emoji: '🐛',
        title: 'عثة البراعم',
        cssClass: 'disease',
        desc: 'تورم البراعم لتصبح كروية وضخمة (حتى 10 مم). البراعم المصابة لا تُنتج أوراقاً أو ثماراً وتسقط مبكراً في الخريف.',
        treatment: '1) رش زيت بترولي (dormant oil) في الشتاء قبل الإنبات. 2) قص وحرق البراعم المصابة. 3) استخدام مبيدات خاصة بالعث (abamectin) في الربيع المبكر. 4) مراقبة البراعم بالشريط اللاصق (Tanglefoot) لاكتشاف الحركة.'
    }
};

// =================== المتغيرات ===================
let video = document.getElementById('video');
let previewImg = document.getElementById('previewImg');
let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');
let stream = null;
let isCameraOn = false;

// =================== حالة التطبيق ===================
function setStatus(text, type) {
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    txt.textContent = text;
    dot.className = 'status-dot';
    if (type) dot.classList.add(type);
}

// =================== الكاميرا ===================
async function toggleCamera() {
    const btn = document.getElementById('camBtn');
    const captureBtn = document.getElementById('captureBtn');
    const placeholder = document.getElementById('cameraPlaceholder');

    if (!isCameraOn) {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment' } 
            });
            video.srcObject = stream;
            video.style.display = 'block';
            previewImg.style.display = 'none';
            placeholder.style.display = 'none';
            btn.innerHTML = '⏹️ إيقاف';
            btn.classList.remove('btn-primary');
            btn.classList.add('btn-secondary');
            captureBtn.disabled = false;
            isCameraOn = true;
            setStatus('📷 الكاميرا تعمل', 'ready');
        } catch(err) {
            alert('⚠️ لا يمكن الوصول للكاميرا. تأكد من منح الإذن.');
        }
    } else {
        stopCamera();
    }
}

function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }
    video.style.display = 'none';
    document.getElementById('cameraPlaceholder').style.display = 'block';
    document.getElementById('camBtn').innerHTML = '📷 تشغيل الكاميرا';
    document.getElementById('camBtn').classList.add('btn-primary');
    document.getElementById('camBtn').classList.remove('btn-secondary');
    document.getElementById('captureBtn').disabled = true;
    isCameraOn = false;
    setStatus('✅ جاهز', 'ready');
}

function capture() {
    if (!isCameraOn) return;

    // رسم الفيديو على canvas
    ctx.drawImage(video, 0, 0, 224, 224);

    // تحويل لصورة
    const dataUrl = canvas.toDataURL('image/png');
    previewImg.src = dataUrl;
    previewImg.style.display = 'block';
    video.style.display = 'none';

    stopCamera();

    // تحليل
    analyzeImage();
}

// =================== المعرض ===================
function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
        previewImg.src = event.target.result;
        previewImg.style.display = 'block';
        document.getElementById('cameraPlaceholder').style.display = 'none';

        const img = new Image();
        img.onload = function() {
            ctx.drawImage(img, 0, 0, 224, 224);
            analyzeImage();
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
}

// =================== التحليل (محاكاة ذكية) ===================
function analyzeImage() {
    setStatus('🔬 جاري التحليل بالذكاء الاصطناعي...', 'analyzing');
    document.getElementById('scanOverlay').classList.add('active');
    document.getElementById('resultCard').classList.remove('show');

    // محاكاة: تحليل لون الصورة لتحديد الاتجاه
    const imageData = ctx.getImageData(0, 0, 224, 224);
    const pixels = imageData.data;
    let greenSum = 0, brownSum = 0, whiteSum = 0;

    for (let i = 0; i < pixels.length; i += 4) {
        const r = pixels[i], g = pixels[i+1], b = pixels[i+2];
        greenSum += g;
        brownSum += (r + b) / 2;
        if (r > 200 && g > 200 && b > 200) whiteSum++;
    }

    const totalPixels = pixels.length / 4;
    const greenAvg = greenSum / totalPixels;
    const brownAvg = brownSum / totalPixels;
    const whitePct = whiteSum / totalPixels;

    // تحديد الفئة بناءً على تحليل الألوان
    let predictedClass = 'healthy';
    let confidence = 0.85;

    if (whitePct > 0.15) {
        predictedClass = 'powdery';
        confidence = 0.78 + (whitePct * 0.2);
    } else if (brownAvg > greenAvg * 1.3) {
        predictedClass = 'rust';
        confidence = 0.72 + Math.random() * 0.15;
    } else if (greenAvg < 80) {
        predictedClass = 'blight';
        confidence = 0.65 + Math.random() * 0.2;
    } else {
        confidence = 0.88 + Math.random() * 0.1;
    }

    confidence = Math.min(confidence, 0.97);

    // محاكاة باقي الفئات
    const allClasses = ['healthy', 'powdery', 'rust', 'blight', 'mite', 'diseased'];
    const predictions = {};
    let remaining = 1 - confidence;

    allClasses.forEach(c => {
        if (c === predictedClass) {
            predictions[c] = confidence;
        } else {
            const rand = Math.random() * remaining * 0.8;
            predictions[c] = rand;
            remaining -= rand;
        }
    });

    // تطبيع
    const total = Object.values(predictions).reduce((a,b) => a+b, 0);
    Object.keys(predictions).forEach(k => predictions[k] /= total);

    setTimeout(() => {
        document.getElementById('scanOverlay').classList.remove('active');
        showResults(predictedClass, predictions);
        setStatus('✅ التحليل اكتمل', 'ready');
    }, 2500);
}

// =================== عرض النتائج ===================
function showResults(topClass, allPredictions) {
    const info = DISEASE_DB[topClass] || DISEASE_DB['diseased'];
    const conf = Math.round(allPredictions[topClass] * 100);

    // Header
    document.getElementById('resultEmoji').textContent = info.emoji;
    document.getElementById('resultEmoji').className = 'result-emoji ' + info.cssClass;

    const titleEl = document.getElementById('resultTitle');
    titleEl.textContent = info.title;
    titleEl.className = 'result-title ' + info.cssClass;

    document.getElementById('resultSub').textContent = topClass + ' — ' + conf + '% ثقة';

    // Confidence bar
    document.getElementById('confPercent').textContent = conf + '%';
    const bar = document.getElementById('confBar');
    bar.className = 'confidence-fill ' + info.cssClass;
    bar.style.width = '0%';
    setTimeout(() => bar.style.width = conf + '%', 100);

    // Details
    document.getElementById('diagText').textContent = info.desc;
    document.getElementById('treatText').textContent = info.treatment;

    // All predictions
    const sorted = Object.entries(allPredictions).sort((a,b) => b[1] - a[1]);
    let predsHtml = '<h4>📊 كل الفئات</h4>';
    sorted.forEach(([name, prob]) => {
        const pct = Math.round(prob * 100);
        const db = DISEASE_DB[name];
        const displayName = db ? db.title : name;
        predsHtml += `
            <div class="pred-row">
                <div class="pred-name">${displayName}</div>
                <div class="pred-bar-wrap"><div class="pred-bar" style="width:${pct}%"></div></div>
                <div class="pred-pct">${pct}%</div>
            </div>
        `;
    });
    document.getElementById('allPreds').innerHTML = predsHtml;

    // Show
    document.getElementById('resultCard').classList.add('show');
    document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// =================== Drag & Drop ===================
const uploadArea = document.getElementById('uploadArea');
['dragover','dragenter'].forEach(e => uploadArea.addEventListener(e, ev => { ev.preventDefault(); uploadArea.classList.add('dragover'); }));
['dragleave','drop'].forEach(e => uploadArea.addEventListener(e, ev => { ev.preventDefault(); uploadArea.classList.remove('dragover'); }));
uploadArea.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) {
        const dt = new DataTransfer();
        dt.items.add(file);
        document.getElementById('fileInput').files = dt.files;
        handleFile({ target: { files: [file] } });
    }
});

// =================== بدء التشغيل ===================
setStatus('✅ جاهز للاستخدام', 'ready');

// تسجيل Service Worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
